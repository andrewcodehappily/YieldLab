[project]
name = "yieldlab"
version = "0.4.4"
description = "Interactive fixed-income analytics and yield-curve research lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
