<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="YieldLab 固定收益分析與殖利率曲線研究實驗室" />
  <title>YieldLab</title>
  <link rel="stylesheet" href="/static/styles.css?v=0.1.1" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">固定收益研究實驗室</p>
        <h1>YieldLab</h1>
        <p class="lede">探索殖利率曲線、利差與債券風險，不需要一台大得像小鋼琴的彭博終端機鍵盤。</p>
      </div>
      <a class="docs-link" href="/docs">介面文件 ↗</a>
    </header>

    <section class="metric-grid" aria-label="殖利率曲線指標">
      <article class="metric-card"><span>2年－10年利差（2s10s）</span><strong id="twoTen">—</strong><small>基點</small></article>
      <article class="metric-card"><span>5年－30年利差（5s30s）</span><strong id="fiveThirty">—</strong><small>基點</small></article>
      <article class="metric-card"><span>短端 → 長端</span><strong id="frontBack">—</strong><small>基點</small></article>
      <article class="metric-card"><span>曲線形狀</span><strong id="shape">—</strong><small id="curveSource">載入中</small></article>
    </section>

    <section class="panel chart-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">曲線探索器</p>
          <h2>美國國債票面殖利率曲線</h2>
        </div>
        <span id="asOf" class="pill">載入中…</span>
      </div>
      <div id="curveChart" class="chart" role="img" aria-label="殖利率曲線圖"></div>
    </section>

    <section class="panel calculator-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">債券引擎</p>
          <h2>價格與風險計算器</h2>
        </div>
        <span class="pill">離散複利</span>
      </div>

      <form id="bondForm" class="bond-form">
        <label>面額<input name="face_value" type="number" value="1000" min="0.01" step="0.01" required></label>
        <label>票面利率 %<input name="coupon_rate_pct" type="number" value="4.25" min="0" step="0.01" required></label>
        <label>到期殖利率 %<input name="yield_to_maturity_pct" type="number" value="4.50" step="0.01" required></label>
        <label>到期年限（年）<input name="maturity_years" type="number" value="10" min="0.5" step="0.5" required></label>
        <label>每年付息次數<select name="payments_per_year"><option value="1">1</option><option value="2" selected>2</option><option value="4">4</option><option value="12">12</option></select></label>
        <button type="submit">分析債券</button>
      </form>

      <div class="result-grid" id="bondResults" aria-live="polite">
        <article><span>價格</span><strong id="price">—</strong></article>
        <article><span>麥考利存續期間</span><strong id="macaulay">—</strong></article>
        <article><span>修正存續期間</span><strong id="modified">—</strong></article>
        <article><span>凸性</span><strong id="convexity">—</strong></article>
        <article><span>每基點價格變動（DV01）</span><strong id="dv01">—</strong></article>
      </div>
      <p id="bondError" class="error" hidden></p>
    </section>

    <footer>YieldLab v0.1 · 讓利率風險少一點神祕，多一點可以直接點。</footer>
  </main>
  <script src="/static/app.js?v=0.1.1" defer></script>
</body>
</html>
